stages:
  - build

build-el10-x86_64:
  stage: build
  before_script:
    - mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
    - mkdir -p ~/mock
    - cp mock/* ~/mock/
    - cp gvm.spec ~/rpmbuild/SPECS/
    - cp SOURCES/* ~/rpmbuild/SOURCES/ || true
    - cd src/ && tar zcvf ~/rpmbuild/SOURCES/gvm.tar.gz gvm/ && cd ..

  script:
    - (if [[ $CI_COMMIT_REF_NAME == "master" ]]; then  gitlab-build.sh el10-x86_64 gvm.spec /mnt/repo/atomic-testing/rocky/10/x86_64/ ; else  gitlab-build.sh el10-x86_64 gvm.spec /mnt/repo/atomic-bleeding/rocky/10/x86_64/ ; fi )

